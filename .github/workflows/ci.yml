name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt pip-audit
      - name: Lint
        run: flake8 .
      - name: Test
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bicep build and lint
        run: |
          az bicep install
          for file in infra/main.bicep infra/alert-subscription.bicep; do
            az bicep build --file "$file" --stdout > /dev/null
            az bicep lint --file "$file"
          done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/configure-secure-webhook.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t azure-service-health-slack:ci .
      - name: Smoke test
        run: |
          docker run -d --name bot -p 5000:5000 \
            -e APP_ENV=test \
            -e SLACK_BOT_TOKEN=xoxb-ci \
            azure-service-health-slack:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:5000/healthz; then
              test "$(docker exec bot id -un)" = "app"
              exit 0
            fi
            sleep 2
          done
          docker logs bot
          exit 1
