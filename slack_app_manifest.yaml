display_information:
  name: Azure Service Health
  description: Posts Azure Service Health incidents to Slack
  background_color: "#0078d4"
features:
  bot_user:
    display_name: azure-service-health
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
