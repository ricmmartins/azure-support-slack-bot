name: azure-service-health-slack
metadata:
  template: azure-service-health-slack@0.0.1
services:
  app:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # Build in Azure Container Registry so a local Docker install is optional.
      remoteBuild: true
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/configure-secure-webhook.ps1
    posix:
      shell: pwsh
      run: ./scripts/configure-secure-webhook.ps1
  # Enables the health probes after the first deploy (no-op afterwards).
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/ensure-app-probes.ps1
    posix:
      shell: pwsh
      run: ./scripts/ensure-app-probes.ps1
